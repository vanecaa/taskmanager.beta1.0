<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="account">
            <img src="#" alt="User Avatar">
            {{ current_user.username }} <!-- Отображаем имя пользователя -->
        </div>

        <div class="add-task">
            <a href="#" onclick="document.getElementById('modalWindowTask').style.display='block'">Add Task</a>
        </div>

        <div class="search">
            <a href="#" onclick="document.getElementById('modalWindowSearch').style.display='block'">Search</a>
        </div>

        <div class="completed">
            <a href="{{ url_for('main.index') }}">Back to Tasks</a>
        </div>
    </div>

    <!-- Заголовок -->
    <div class="header">
        <p class="header-text">Search Results</p>
    </div>

    <!-- Список найденных задач -->
    <div class="task-window">
        <h1>Search Results for "{{ query }}"</h1>
        <div id="task-list">
            <ul class="ul">
                {% for task in tasks %}
                <li class="list">
                    <div class="list-task">
                        <span class="{% if task.completed %}completed{% endif %}">{{ task.title }} - {{ task.description }}</span>
                        <a href="{{ url_for('main.complete_task', id=task.id) }}">✔️</a>
                        <a href="{{ url_for('main.delete_task', id=task.id) }}">❌</a>
                        <form action="{{ url_for('main.toggle_tracking', task_id=task.id) }}" method="POST" style="display: inline;">
                            <button type="submit">
                                {% if task in current_user.tracked_tasks %} Убрать отслеживание {% else %} Отслеживать {% endif %}
                            </button>
                        </form>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body> <
</html>
