<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактирование задачи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Редактирование задачи</h1>
        <form method="POST">
            <div class="form-group">
                <label>Название:</label>
                <input type="text" name="title" value="{{ task.title }}" required>
            </div>
            <div class="form-group">
                <label>Описание:</label>
                <textarea name="description">{{ task.description }}</textarea>
            </div>
            <div class="form-group">
                <label>Дата:</label>
                <input type="date" name="date" value="{{ task.date.strftime('%Y-%m-%d') if task.date else '' }}">
            </div>
            <div class="form-group">
                <label>Ответственный:</label>
                <input type="text" name="responsible" value="{{ task.responsible or '' }}">
            </div>
            <div class="form-group">
                <label>Регион:</label>
                <input type="text" name="region" value="{{ task.region or '' }}">
            </div>
            <div class="form-group">
                <label>Приоритет:</label>
                <select name="priority">
                    <option value="Срочный" {% if task.priority == 'Срочный' %}selected{% endif %}>Срочный</option>
                    <option value="Высокий" {% if task.priority == 'Высокий' %}selected{% endif %}>Высокий</option>
                    <option value="Средний" {% if task.priority == 'Средний' %}selected{% endif %}>Средний</option>
                    <option value="Низкий" {% if task.priority == 'Низкий' %}selected{% endif %}>Низкий</option>
                </select>
            </div>
            <button type="submit">Сохранить</button>
            <a href="{{ url_for('main.index') }}">Отмена</a>
        </form>
    </div>
</body>
</html>
